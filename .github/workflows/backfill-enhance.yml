name: backfill-ai-enhance

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Start date, YYYY-MM-DD"
        required: true
      end_date:
        description: "End date, YYYY-MM-DD"
        required: true
      language:
        description: "Output language, e.g. Chinese or English"
        required: false
        default: "Chinese"
      max_workers:
        description: "Parallel AI workers"
        required: false
        default: "1"

concurrency:
  group: backfill-ai-enhance-${{ github.event.inputs.start_date }}-${{ github.event.inputs.end_date }}-${{ github.event.inputs.language }}
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv sync

      - name: Validate inputs
        run: |
          START="${{ github.event.inputs.start_date }}"
          END="${{ github.event.inputs.end_date }}"
          if ! date -d "$START" +%F >/dev/null 2>&1; then
            echo "Invalid start_date: $START"
            exit 1
          fi
          if ! date -d "$END" +%F >/dev/null 2>&1; then
            echo "Invalid end_date: $END"
            exit 1
          fi
          if [ "$(date -d "$START" +%s)" -gt "$(date -d "$END" +%s)" ]; then
            echo "start_date must be <= end_date"
            exit 1
          fi

      - name: Fetch data branch
        run: |
          git fetch origin data
          rm -rf /tmp/data_branch
          git worktree add /tmp/data_branch origin/data
          mkdir -p data assets /tmp/backfill_out/data /tmp/backfill_out/assets

      - name: Backfill AI enhancement
        run: |
          source .venv/bin/activate
          export OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          export OPENAI_BASE_URL=${{ secrets.OPENAI_BASE_URL }}
          export TOKEN_GITHUB=${{ secrets.TOKEN_GITHUB }}
          export LANGUAGE="${{ github.event.inputs.language }}"
          export CATEGORIES="${{ vars.CATEGORIES }}"
          export MODEL_NAME="${{ vars.MODEL_NAME }}"

          START="${{ github.event.inputs.start_date }}"
          END="${{ github.event.inputs.end_date }}"
          MAX_WORKERS="${{ github.event.inputs.max_workers }}"
          CURRENT="$START"

          while [ "$(date -d "$CURRENT" +%s)" -le "$(date -d "$END" +%s)" ]; do
            RAW_FILE="/tmp/data_branch/data/${CURRENT}.jsonl"
            if [ -f "$RAW_FILE" ]; then
              echo "Backfilling $CURRENT..."
              cp "$RAW_FILE" "data/${CURRENT}.jsonl"

              cd ai
              python enhance.py --data "../data/${CURRENT}.jsonl" --max_workers "$MAX_WORKERS"
              cd ..

              AI_FILE="data/${CURRENT}_AI_enhanced_${LANGUAGE}.jsonl"
              if [ ! -f "$AI_FILE" ]; then
                echo "AI enhanced file not generated: $AI_FILE"
                exit 1
              fi

              cd to_md
              python convert.py --data "../${AI_FILE}"
              cd ..

              cp "data/${CURRENT}.jsonl" /tmp/backfill_out/data/
              cp "$AI_FILE" /tmp/backfill_out/data/
              if [ -f "data/${CURRENT}.md" ]; then
                cp "data/${CURRENT}.md" /tmp/backfill_out/data/
              fi
            else
              echo "Skip $CURRENT: raw file not found on data branch"
            fi
            CURRENT=$(date -I -d "$CURRENT + 1 day")
          done

      - name: Update file list
        run: |
          cp /tmp/data_branch/assets/file-list.txt /tmp/backfill_out/assets/file-list.txt 2>/dev/null || true
          for f in /tmp/backfill_out/data/*.jsonl; do
            [ -e "$f" ] || continue
            basename "$f" >> /tmp/backfill_out/assets/file-list.txt
          done
          if [ -f /tmp/backfill_out/assets/file-list.txt ]; then
            sort -u /tmp/backfill_out/assets/file-list.txt -o /tmp/backfill_out/assets/file-list.txt
          fi

      - name: Commit backfilled files to data branch
        run: |
          git config --global user.email "${{ vars.EMAIL }}"
          git config --global user.name "${{ vars.NAME }}"

          cd /tmp/data_branch
          mkdir -p data assets
          cp -r /tmp/backfill_out/data/* data/ 2>/dev/null || true
          cp /tmp/backfill_out/assets/file-list.txt assets/file-list.txt 2>/dev/null || true

          git add data/* assets/file-list.txt 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No backfilled changes to commit"
          else
            git commit -m "backfill: AI enhancement ${{ github.event.inputs.start_date }} to ${{ github.event.inputs.end_date }}"
          fi

      - name: Push data branch
        run: |
          cd /tmp/data_branch
          git config pull.rebase true
          git config rebase.autoStash true
          for i in {1..3}; do
            echo "Push attempt $i"
            if git push origin HEAD:data; then
              echo "Push succeeded"
              break
            fi
            git pull origin data --no-edit || true
            if [ $i -eq 3 ]; then
              echo "Failed to push after 3 attempts"
              exit 1
            fi
          done
